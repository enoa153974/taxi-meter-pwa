<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>売上集計ページ</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- ぺーj固有のCSS -->
    <link rel="stylesheet" href="./css/sales-details.css" />

    <!-- Font Awesome（戻るアイコンなどで使える） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <!-- header -->
    <header class="header">
        <button class="phrases-back" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            戻る
        </button>
        <h1 class="phrases-title">売上集計</h1>
    </header>

    <main class="sales-details">
        <p id="billingPeriod" class="billing-period"></p>
        <h2>売上詳細</h2>

        <section class="total-table">
            <p id="totalGross" class="total-gross"></p>
            <p id="totalNet" class="total-net"></p>
        </section>

        <section class="day">
            <h3 class="day__heading">日別売上</h3>
            <table class="day__table">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>税込</th>
                        <th>税抜</th>
                        <th>メモ</th>
                    </tr>
                </thead>
                <tbody id="dailySales" class="daily-sales__table"></tbody>
            </table>
        </section>

        <section class="log">
            <h3 class="log__heading">日別ログ</h3>
            <div id="dailyLogs" class="log__inner"></div>
        </section>

    </main>

    <!-- footer -->
    <footer class="footer">
        <button class="phrases-back" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            戻る
        </button>
    </footer>

</body>

<script type="module" src="./js/sales-details.js"></script>

</html>
